<title>Prancheta do Efeito Sonoro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: folhas de prancheta deitadas (A4 paisagem), identidade Nexus. Quadros à esquerda, falas à direita.
   Um tema só (claro), de propósito: é um documento para imprimir. */
:root {
  /* marca Nexus — ver marca/MARCA.md */
  --nx-roxo: #7463EA; --nx-escuro: #14121C; --nx-claro: #E8E8E8; --nx-roxo-claro: #A397F3;
  --bg: var(--nx-claro); --sheet: #ffffff; --fg: var(--nx-escuro); --muted: #6a6778; --line: #dedce6; --soft: #f3f2f8;
  --accent: var(--nx-roxo); --accent-ink: #ffffff; --b: var(--nx-escuro); --stock: #9a97a8;
  /* visor da câmera: escuro, puxado para o tom da marca; cartelas e slides são brancos */
  --vf-wall-1: #2b2735; --vf-wall-2: #1d1a25; --vf-desk: #4b4559; --vf-body: #8e89a2; --vf-head: #aca7bf;
  --vf-grid: rgba(255,255,255,.55); --vf-white: #f6f6f9; --vf-ink: var(--nx-escuro); --vf-hl: var(--nx-roxo-claro);
  --display: "Plus Jakarta Sans", "Helvetica Neue", Arial, sans-serif;
  --body: "Plus Jakarta Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --cut: polygon(.32em 0, 100% 0, 100% calc(100% - .32em), calc(100% - .32em) 100%, 0 100%, 0 .32em); /* cantos cortados do símbolo */
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); }
.wrap { padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 24px; justify-items: center; }
.wrap > * { min-width: 0; width: 100%; max-width: 1123px; }

.page { background: var(--sheet); aspect-ratio: 297 / 210; padding: 24px 30px 18px; box-shadow: 0 1px 2px rgba(20,18,28,.08), 0 8px 24px rgba(20,18,28,.07);
  display: grid; grid-template-rows: auto 1fr auto; gap: 16px; position: relative; overflow: hidden; }
.page::after { content: ""; position: absolute; right: -60px; bottom: -60px; width: 220px; height: 170px; background: var(--simbolo) no-repeat center / contain; opacity: .06; pointer-events: none; }

.head { display: grid; grid-template-columns: 1fr auto; gap: 6px 20px; align-items: end; border-bottom: 2px solid var(--fg); padding-bottom: 10px; }
.brandrow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brandrow img { height: 20px; width: auto; display: block; }
.slate { font: 500 11px/1.4 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.head h2 { grid-column: 1; margin: 2px 0 0; font: 800 30px/1.05 var(--display); letter-spacing: -.02em; text-wrap: balance; }
.head h2 em { font-style: normal; background: var(--accent); color: var(--accent-ink); padding: 0 .22em; clip-path: var(--cut); }
.pg { grid-column: 2; grid-row: 1 / 3; text-align: right; font: 800 34px/1 var(--display); }
.pg small { display: block; font: 500 11px/1.4 var(--mono); color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.mini { grid-column: 1 / -1; display: flex; height: 8px; margin-top: 6px; }
.mini span { border-right: 1px solid var(--sheet); opacity: .25; }
.mini span.on { opacity: 1; }
.k-A { background: var(--accent); } .k-B { background: var(--b); } .k-S { background: var(--stock); }
.k-C { background: repeating-linear-gradient(135deg, var(--muted) 0 2px, transparent 2px 5px); }

.body { display: grid; grid-template-columns: 1.3fr 1fr; gap: 28px; min-height: 0; }
.frames { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 14px; align-content: start; }
.fr { display: grid; gap: 6px; align-content: start; min-width: 0; margin: 0; }
.fr svg { display: block; width: 100%; max-width: 230px; height: auto; border-radius: 2px; }
.fr h3 { margin: 2px 0 0; font: 700 14px/1.15 var(--display); letter-spacing: -.01em; }
.fr .t { font: 500 10.5px/1.2 var(--mono); color: var(--muted); }
.fr p { margin: 0; font-size: 12px; line-height: 1.38; color: var(--muted); }
.chip { display: inline-block; font: 700 9.5px/1 var(--display); letter-spacing: .06em; padding: 4px 6px 3px; text-transform: uppercase; clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px); }
.chip.A { background: var(--accent); color: var(--accent-ink); }
.chip.B { background: var(--b); color: #fff; }
.chip.S { background: var(--stock); color: #fff; }
.chip.C { background: var(--soft); color: var(--muted); }

.lines { display: grid; align-content: start; border-left: 1px solid var(--line); padding-left: 24px; min-width: 0; }
.lines h4 { margin: 0 0 8px; font: 500 11px/1 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.ln { display: grid; grid-template-columns: 74px 1fr; gap: 2px 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.lines h4 + .ln { border-top: 0; }
.ln .tc { font: 500 11px/1.5 var(--mono); color: var(--muted); display: grid; gap: 4px; align-content: start; justify-items: start; }
.ln .say { font: 500 16.5px/1.38 var(--body); text-wrap: pretty; }
.ln .say b { background: linear-gradient(transparent 60%, rgba(116,99,234,.28) 60%); font-weight: 700; }
.ln .meta { grid-column: 2; font-size: 11.5px; line-height: 1.4; color: var(--muted); }
.ln .meta i { font-style: normal; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; margin-right: 4px; color: var(--accent); }

.foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
.foot .sw { display: inline-block; width: 18px; height: 10px; margin-right: 5px; vertical-align: -1px; }
.foot .nx { margin-left: auto; font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.sw.grid { background: linear-gradient(90deg, transparent 8px, #fff 8px 9px, transparent 9px), var(--vf-wall-2); }
.sw.eye { background: linear-gradient(transparent 4px, var(--vf-hl) 4px 6px, transparent 6px), var(--vf-wall-2); }
.sw.txt { background: linear-gradient(transparent 2px, var(--accent) 2px 8px, transparent 8px), var(--vf-wall-2); }
.sw.ui { background: repeating-linear-gradient(135deg, rgba(255,110,110,.7) 0 2px, transparent 2px 4px), var(--vf-wall-2); }

a.cta { display: inline-flex; align-items: center; gap: 9px; background: var(--accent); color: #fff; font: 700 13.5px/1 var(--display); letter-spacing: -.005em; padding: 10px 16px 10px 11px; text-decoration: none; clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px); }
a.cta:hover { background: #5f4fd6; }
a.cta:focus-visible { background: var(--fg); outline: none; }
a.cta svg { flex: none; }
a.cta.big { font-size: 15px; padding: 13px 20px 13px 14px; }
.url { font: 500 10.5px/1.4 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
a.ref { color: var(--fg); font: 600 13px/1.3 var(--body); text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 3px; text-underline-offset: 3px; overflow-wrap: anywhere; }
.refline { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 4px; }
.refline a.ref { text-transform: none; letter-spacing: 0; margin-left: 4px; }
.refbox { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; background: var(--soft); padding: 14px 16px; font-size: 13.5px; }
.refbox > div { display: grid; gap: 2px; min-width: 0; }
.refbox b { font: 700 14.5px/1.2 var(--display); }

/* folha final */
.closing { display: grid; grid-template-columns: 1fr 1.35fr; gap: 16px 28px; min-height: 0; align-content: start; }
.closing h3 { margin: 0 0 10px; font: 800 20px/1.1 var(--display); letter-spacing: -.02em; }
ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 9px; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; gap: 0 10px; font-size: 13px; line-height: 1.4; }
ol.steps li::before { content: counter(s); grid-row: 1 / 3; font: 800 20px/1 var(--display); color: var(--accent); }
ol.steps b { font: 700 14px/1.25 var(--display); }
.ed-note { margin: 0 0 10px; font-size: 13px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.cols > div { background: var(--soft); padding: 10px 12px 12px; border-top: 3px solid var(--accent); min-width: 0; }
.cols > div.free { border-top-color: var(--b); }
.cols h4 { margin: 0 0 6px; font: 700 13.5px/1.15 var(--display); }
.cols ul { margin: 0; padding-left: 16px; display: grid; gap: 4px; font-size: 12px; line-height: 1.4; }
.cols .why { color: var(--muted); }

@media screen and (max-width: 860px) {
  .page { aspect-ratio: auto; padding: 18px 16px 14px; }
  .body, .closing, .cols { grid-template-columns: 1fr; }
  .frames { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lines { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 12px; }
  .head h2 { font-size: 24px; }
}
@media print {
  @page { size: A4 landscape; margin: 0; }
  body { background: #fff; }
  .wrap { padding: 0; gap: 0; }
  .wrap > * { max-width: none; }
  .page { width: 297mm; height: 210mm; aspect-ratio: auto; box-shadow: none; break-after: page; }
}
</style>

const NS = "http://www.w3.org/2000/svg", W = 90, H = 160;
let uid = 0;
const el = (tag, a = {}, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };

// silhueta anônima: cabeça, pescoço, ombros caídos e braços sugeridos; sem rosto
function silhueta(g, cx, hy, s) {
  const P = (dx, dy) => `${cx + dx * s} ${hy + dy * s}`;
  el("path", { fill: "var(--vf-body)", d:
    `M${P(-2.4, 4.6)} L${P(-2.8, 10.6)} C${P(-4.2, 12.2)} ${P(-9, 13)} ${P(-12.5, 14.4)} C${P(-16, 15.8)} ${P(-17.8, 18.5)} ${P(-18.3, 22.5)}` +
    ` L${cx - 18.8 * s} ${H + 60} L${cx + 18.8 * s} ${H + 60}` +
    ` L${P(18.3, 22.5)} C${P(17.8, 18.5)} ${P(16, 15.8)} ${P(12.5, 14.4)} C${P(9, 13)} ${P(4.2, 12.2)} ${P(2.8, 10.6)} L${P(2.4, 4.6)} Z` }, g);
  const sombra = { stroke: "rgba(20,18,28,.22)", "stroke-width": .6 * s, fill: "none", "stroke-linecap": "round" };
  el("path", { ...sombra, d: `M${P(-13.6, 22)} C${P(-13.4, 30)} ${P(-13.8, 40)} ${P(-14.2, 60)}` }, g);
  el("path", { ...sombra, d: `M${P(13.6, 22)} C${P(13.4, 30)} ${P(13.8, 40)} ${P(14.2, 60)}` }, g);
  el("ellipse", { cx, cy: hy + 6.6 * s, rx: 3.2 * s, ry: 1.4 * s, fill: "rgba(20,18,28,.18)" }, g);
  el("ellipse", { cx, cy: hy, rx: 5.7 * s, ry: 7.1 * s, fill: "var(--vf-body)" }, g);
}

function sala(svg) {
  const id = "w" + (++uid), defs = el("defs", {}, svg);
  const lg = el("linearGradient", { id, x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  el("stop", { offset: 0, "stop-color": "var(--vf-wall-1)" }, lg); el("stop", { offset: 1, "stop-color": "var(--vf-wall-2)" }, lg);
  const rg = el("radialGradient", { id: id + "l", cx: .85, cy: .3, r: .45 }, defs);
  el("stop", { offset: 0, "stop-color": "rgba(255,200,130,.22)" }, rg); el("stop", { offset: 1, "stop-color": "rgba(255,200,130,0)" }, rg);
  el("rect", { width: W, height: H, fill: `url(#${id})` }, svg);
  el("rect", { width: W, height: H, fill: `url(#${id}l)` }, svg);
  el("rect", { x: 7, y: 36, width: 15, height: 19, fill: "none", stroke: "rgba(255,255,255,.1)", "stroke-width": .8 }, svg);
}
function grade(svg) {
  const g = el("g", { stroke: "var(--vf-grid)", "stroke-width": .45, "stroke-dasharray": "2 1.6" }, svg);
  for (const f of [1 / 3, 2 / 3]) { el("line", { x1: W * f, y1: 0, x2: W * f, y2: H }, g); el("line", { x1: 0, y1: H * f, x2: W, y2: H * f }, g); }
}
function interfaceIG(svg) {
  const id = "h" + (++uid), defs = el("defs", {}, svg);
  const p = el("pattern", { id, width: 3, height: 3, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" }, defs);
  el("rect", { width: 1.1, height: 3, fill: "rgba(255,110,110,.45)" }, p);
  el("rect", { x: 0, y: H * .83, width: W, height: H * .17, fill: `url(#${id})` }, svg);
  el("rect", { x: W * .87, y: H * .53, width: W * .13, height: H * .30, fill: `url(#${id})` }, svg);
}
function olhos(svg, y) {
  for (const [a, b] of [[0, 7], [W - 7, W]]) el("line", { x1: a, y1: y, x2: b, y2: y, stroke: "var(--vf-hl)", "stroke-width": 1.3 }, svg);
}
function texto(svg, x, y, w, h, label, size, cor = "#fff") {
  el("rect", { x, y, width: w, height: h, rx: 1, fill: "rgba(116,99,234,.30)", stroke: "var(--vf-hl)", "stroke-width": .5 }, svg);
  el("text", { x: x + w / 2, y: y + h / 2 + size * .36, "text-anchor": "middle", fill: cor, "font-family": "Plus Jakarta Sans, Arial, sans-serif", "font-weight": 800, "font-size": size }, svg).textContent = label;
}
function mesa(svg) { el("polygon", { points: `0,104 ${W},119 ${W},${H} 0,${H}`, fill: "var(--vf-desk)" }, svg); }
function branco(svg) { el("rect", { width: W, height: H, fill: "var(--vf-white)" }, svg); }
function janela(svg, x, y, w, h, s, hy) {
  const id = "c" + (++uid), cp = el("clipPath", { id }, el("defs", {}, svg));
  el("rect", { x, y, width: w, height: h }, cp);
  const g = el("g", { "clip-path": `url(#${id})` }, svg);
  el("rect", { x, y, width: w, height: h, fill: "var(--vf-wall-2)" }, g);
  silhueta(g, x + w / 2, hy, s);
}
function rotulo(svg, x, y, txt, size = 4.6, cor = "#8a929b") {
  el("text", { x, y, "text-anchor": "middle", fill: cor, "font-family": "JetBrains Mono, monospace", "font-size": size }, svg).textContent = txt;
}

const DESENHOS = {
  A(s) { sala(s); silhueta(s, 45, 63, 1.7); texto(s, 9, 15, 72, 21, "TEXTO GIGANTE", 8); grade(s); interfaceIG(s); olhos(s, 63); },
  entrada(s) {
    sala(s);
    const ghost = el("g", { opacity: .35, transform: "translate(22 4) rotate(-7 45 110)" }, s); silhueta(ghost, 45, 63, 1.7);
    silhueta(s, 45, 63, 1.7);
    const a = el("g", { stroke: "var(--vf-hl)", "stroke-width": 1.6, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" }, s);
    el("path", { d: "M80 50 Q70 44 60 47" }, a); el("path", { d: "M63 43 L59 47 L64 50" }, a);
    grade(s); interfaceIG(s); olhos(s, 63);
  },
  B(s) { sala(s); silhueta(s, 45, 54, 1.15); mesa(s); texto(s, 31, 79, 28, 9, "legenda", 6.5); grade(s); interfaceIG(s); olhos(s, 54); },
  cta(s) { sala(s); silhueta(s, 45, 54, 1.15); mesa(s); texto(s, 29, 79, 32, 10, "“SOM”", 7.5, "#c9c1fa"); grade(s); interfaceIG(s); olhos(s, 54); },
  acervo(s) { branco(s); rotulo(s, 45, 15, "VÍDEO ANTIGO"); janela(s, 11, 22, 68, 121, 1.05, 72); rotulo(s, 45, 153, "cru → editado", 4.4, "#6b737c"); },
  cartela(s) {
    branco(s);
    el("text", { x: 45, y: 84, "text-anchor": "middle", fill: "var(--vf-ink)", "font-family": "Plus Jakarta Sans, Arial, sans-serif", "font-style": "italic", "font-weight": 600, "font-size": 12 }, s).textContent = "Efeito sonoro";
  },
  mao(s) {
    sala(s); const g = el("g", { opacity: .4 }, s); silhueta(g, 45, 63, 1.7);
    const m = el("g", { fill: "#c7cdd4" }, s);
    el("ellipse", { cx: 46, cy: 100, rx: 29, ry: 33 }, m);
    [[20, 56, -16], [33, 44, -6], [47, 41, 3], [60, 46, 12]].forEach(([x, y, r]) => el("rect", { x, y, width: 11, height: 38, rx: 5.5, transform: `rotate(${r} ${x + 5.5} ${y + 19})` }, m));
    el("rect", { x: 68, y: 88, width: 11, height: 30, rx: 5.5, transform: "rotate(50 73.5 103)" }, m);
    grade(s); interfaceIG(s);
  },
  digitando(s) {
    branco(s);
    const f = { "text-anchor": "middle", fill: "var(--vf-ink)", "font-family": "Plus Jakarta Sans, Arial, sans-serif", "font-weight": 600, "font-size": 7.4 };
    el("text", { ...f, x: 45, y: 76 }, s).textContent = "3 erros que deixam";
    el("text", { ...f, x: 42, y: 87 }, s).textContent = "seu conteúdo cha";
    el("rect", { x: 70.5, y: 81, width: .9, height: 8, fill: "var(--vf-ink)" }, s);
  },
  slide(s) {
    branco(s);
    el("text", { x: 45, y: 20, "text-anchor": "middle", fill: "var(--vf-ink)", "font-family": "Plus Jakarta Sans, Arial, sans-serif", "font-weight": 800, "font-size": 7.6 }, s).textContent = "Texto de abertura";
    janela(s, 14, 28, 62, 110, 1, 70);
    rotulo(s, 45, 151, "+ 3 slides iguais", 4.4, "#6b737c");
  },
};

/* ---------- montagem das folhas ---------- */
const wrap = document.getElementById("wrap");
document.documentElement.style.setProperty("--simbolo", `url(${MARCA.simbolo})`);
const nFolhas = FOLHAS.length + 1;
const seg = n => String(n).replace(".", ",");

function cabecalho(i, titulo, faixa) {
  const h = document.createElement("header"); h.className = "head";
  h.innerHTML = `<div class="brandrow"><img src="${MARCA.logo}" alt="Nexus"><span class="slate">Prancheta · ${ROTEIRO}</span></div><h2>${titulo}</h2><div class="pg"><small>folha</small>${i}<small>de ${nFolhas}</small></div>`;
  const mini = document.createElement("div"); mini.className = "mini";
  for (const c of CENAS) {
    const sp = document.createElement("span"); sp.className = "k-" + c.k; sp.style.flex = String(c.t[1] - c.t[0]);
    if (!faixa || (c.t[0] >= faixa[0] && c.t[1] <= faixa[1])) sp.classList.add("on");
    mini.appendChild(sp);
  }
  h.appendChild(mini);
  const sub = document.createElement("div"); sub.className = "slate"; sub.style.gridColumn = "1 / -1";
  sub.textContent = faixa ? `${seg(faixa[0])}–${seg(faixa[1])} s` : "antes de gravar e editar";
  h.appendChild(sub);
  if (i === 1) h.insertAdjacentHTML("beforeend", `<div class="refline"><a class="cta" href="${REFERENCIA.url}" target="_blank" rel="noopener">${PLAY}Assistir vídeo de referência</a><span class="url">${REFERENCIA.nome} · ${REFERENCIA.url}</span></div>`);
  return h;
}
function rodape() {
  const f = document.createElement("footer"); f.className = "foot";
  f.innerHTML = `<span><i class="sw grid"></i>grade 3×3 da câmera</span><span><i class="sw eye"></i>linha dos olhos</span><span><i class="sw txt"></i>onde entra o texto</span><span><i class="sw ui"></i>interface do Instagram (aprox.)</span><span class="nx">Nexus</span>`;
  return f;
}

FOLHAS.forEach((F, i) => {
  const page = document.createElement("section"); page.className = "page";
  page.appendChild(cabecalho(i + 1, F.titulo, F.faixa));
  const body = document.createElement("div"); body.className = "body";
  const frames = document.createElement("div"); frames.className = "frames"; frames.style.setProperty("--n", F.quadros.length);
  for (const q of F.quadros) {
    const fr = document.createElement("figure"); fr.className = "fr";
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": q.nome });
    DESENHOS[q.d](svg); fr.appendChild(svg);
    fr.insertAdjacentHTML("beforeend", `<div><span class="chip ${q.k}">${CHIP[q.k]}</span></div><h3>${q.nome}</h3><div class="t">${q.t}</div><p>${q.nota}</p>`);
    frames.appendChild(fr);
  }
  const lines = document.createElement("div"); lines.className = "lines";
  lines.innerHTML = "<h4>Falas desta faixa</h4>";
  for (const l of F.falas) {
    lines.insertAdjacentHTML("beforeend", `<div class="ln"><div class="tc">${l.t}<span class="chip ${l.k}">${CHIP[l.k]}</span></div><div class="say">${l.fala}</div><div class="meta"><i>tela</i>${l.tela} · <i>som</i>${l.som}</div></div>`);
  }
  body.append(frames, lines);
  page.append(body, rodape());
  wrap.appendChild(page);
});

const fim = document.createElement("section"); fim.className = "page";
fim.appendChild(cabecalho(nFolhas, "Gravação e <em>edição</em>", null));
const cl = document.createElement("div"); cl.className = "closing";
cl.innerHTML = `<div class="refbox"><a class="cta big" href="${REFERENCIA.url}" target="_blank" rel="noopener">${PLAY}Assistir vídeo de referência</a><div><b>Assista antes de gravar e de editar</b><span>É o ritmo e a estrutura que este roteiro segue.</span><span class="url">${REFERENCIA.nome} · ${REFERENCIA.url}</span></div></div>
<div><h3>Ordem de gravação</h3><ol class="steps">${FECHAMENTO.passos.map(([t, d]) => `<li><b>${t}</b><span>${d}</span></li>`).join("")}</ol></div>
<div><h3>Para o editor</h3><p class="ed-note">Isto é um norte, não uma receita. Os tempos são referência. Confio na sua criatividade: se tiver uma ideia melhor, faça e me mostre. Só não deixe a intenção se perder.</p>
<div class="cols"><div><h4>A intenção (não pode faltar)</h4><ul>${FECHAMENTO.intencao.map(x => `<li>${x}</li>`).join("")}</ul></div>
<div class="free"><h4>Fica a seu critério</h4><ul>${FECHAMENTO.livre.map(x => `<li>${x}</li>`).join("")}</ul></div></div></div>`;
fim.append(cl, rodape());
wrap.appendChild(fim);
</script>
