<title>Prancheta do Efeito Sonoro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: folhas de prancheta deitadas (A4 paisagem). Em cada folha: quadros à esquerda, falas à direita. */
:root {
  --bg: #dfe2e6; --sheet: #fbfbfc; --fg: #1b1f24; --muted: #66707b; --line: #d5dae0; --soft: #f0f2f4;
  --accent: #f5d000; --accent-ink: #1b1f24; --b: #3f7fc8; --stock: #8c96a1;
  /* o visor da câmera é escuro nos dois temas; cartelas e slides são brancos */
  --vf-wall-1: #333a42; --vf-wall-2: #262b31; --vf-desk: #6e6256; --vf-body: #8a95a2; --vf-head: #a2acb7;
  --vf-grid: rgba(255,255,255,.55); --vf-white: #f6f7f8; --vf-ink: #22272d;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121518; --sheet: #1b1f24; --fg: #e8ebee; --muted: #9aa3ad; --line: #2e343b; --soft: #23282e;
  --b: #6fa6e6; --stock: #6b7480; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121518; --sheet: #1b1f24; --fg: #e8ebee; --muted: #9aa3ad; --line: #2e343b; --soft: #23282e;
  --b: #6fa6e6; --stock: #6b7480; color-scheme: dark }

*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); }
.wrap { padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 24px; justify-items: center; }
.wrap > * { min-width: 0; width: 100%; max-width: 1123px; }

.page { background: var(--sheet); aspect-ratio: 297 / 210; padding: 26px 30px 18px; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
  display: grid; grid-template-rows: auto 1fr auto; gap: 16px; }

.head { display: grid; grid-template-columns: 1fr auto; gap: 6px 20px; align-items: end; border-bottom: 2px solid var(--fg); padding-bottom: 10px; }
.slate { font: 500 11px/1.4 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.head h2 { grid-column: 1; margin: 0; font: 700 30px/1 var(--display); text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.head h2 em { font-style: normal; background: var(--accent); color: var(--accent-ink); padding: 0 .12em; }
.pg { grid-column: 2; grid-row: 1 / 3; text-align: right; font: 700 34px/1 var(--display); }
.pg small { display: block; font: 500 11px/1.4 var(--mono); color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
.mini { grid-column: 1 / -1; display: flex; height: 8px; margin-top: 6px; }
.mini span { border-right: 1px solid var(--sheet); opacity: .28; }
.mini span.on { opacity: 1; }
.k-A { background: var(--accent); } .k-B { background: var(--b); } .k-S { background: var(--stock); }
.k-C { background: repeating-linear-gradient(135deg, var(--muted) 0 2px, transparent 2px 5px); }

.body { display: grid; grid-template-columns: 1.3fr 1fr; gap: 28px; min-height: 0; }
.frames { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 14px; align-content: start; }
.fr { display: grid; gap: 6px; align-content: start; min-width: 0; margin: 0; }
.fr svg { display: block; width: 100%; max-width: 230px; height: auto; border-radius: 2px; }
.fr h3 { margin: 2px 0 0; font: 700 15px/1.1 var(--display); text-transform: uppercase; letter-spacing: .02em; }
.fr .t { font: 500 10.5px/1.2 var(--mono); color: var(--muted); }
.fr p { margin: 0; font-size: 12.5px; line-height: 1.35; color: var(--muted); }
.chip { display: inline-block; font: 700 10px/1 var(--display); letter-spacing: .07em; padding: 3px 5px 2px; text-transform: uppercase; }
.chip.A { background: var(--accent); color: var(--accent-ink); }
.chip.B { background: var(--b); color: #fff; }
.chip.S { background: var(--stock); color: #fff; }
.chip.C { box-shadow: inset 0 0 0 1px var(--muted); color: var(--muted); }

.lines { display: grid; align-content: start; border-left: 1px solid var(--line); padding-left: 24px; min-width: 0; }
.lines h4 { margin: 0 0 8px; font: 500 11px/1 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.ln { display: grid; grid-template-columns: 74px 1fr; gap: 2px 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.lines h4 + .ln { border-top: 0; }
.ln .tc { font: 500 11px/1.5 var(--mono); color: var(--muted); display: grid; gap: 4px; align-content: start; justify-items: start; }
.ln .say { font: 500 17px/1.35 var(--body); text-wrap: pretty; }
.ln .say b { background: linear-gradient(transparent 58%, rgba(245,208,0,.55) 58%); font-weight: 600; }
.ln .meta { grid-column: 2; font-size: 12px; line-height: 1.4; color: var(--muted); }
.ln .meta i { font-style: normal; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; margin-right: 4px; }

.foot { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
.foot .sw { display: inline-block; width: 18px; height: 10px; margin-right: 5px; vertical-align: -1px; }
.sw.grid { background: linear-gradient(90deg, transparent 8px, #fff 8px 9px, transparent 9px), #2b3138; }
.sw.eye { background: linear-gradient(transparent 4px, var(--accent) 4px 6px, transparent 6px), #2b3138; }
.sw.txt { background: linear-gradient(transparent 2px, var(--accent) 2px 8px, transparent 8px), #2b3138; }
.sw.ui { background: repeating-linear-gradient(135deg, rgba(255,110,110,.7) 0 2px, transparent 2px 4px), #2b3138; }

/* folha final */
.closing { display: grid; grid-template-columns: 1fr 1.35fr; gap: 28px; min-height: 0; }
.closing h3 { margin: 0 0 10px; font: 700 20px/1 var(--display); text-transform: uppercase; letter-spacing: .03em; }
ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 9px; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; gap: 0 10px; font-size: 13.5px; line-height: 1.4; }
ol.steps li::before { content: counter(s); grid-row: 1 / 3; font: 700 22px/1 var(--display); color: var(--muted); }
ol.steps b { font: 700 15px/1.2 var(--display); text-transform: uppercase; letter-spacing: .02em; }
.ed-note { margin: 0 0 10px; font-size: 13.5px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.cols > div { background: var(--soft); padding: 10px 12px 12px; border-top: 3px solid var(--accent); min-width: 0; }
.cols > div.free { border-top-color: var(--b); }
.cols h4 { margin: 0 0 6px; font: 700 14px/1.1 var(--display); text-transform: uppercase; letter-spacing: .03em; }
.cols ul { margin: 0; padding-left: 16px; display: grid; gap: 4px; font-size: 12.5px; line-height: 1.38; }
.cols .why { color: var(--muted); }

@media screen and (max-width: 860px) {
  .page { aspect-ratio: auto; padding: 18px 16px 14px; }
  .body, .closing, .cols { grid-template-columns: 1fr; }
  .frames { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lines { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 12px; }
  .head h2 { font-size: 24px; }
}
@media print {
  @page { size: A4 landscape; margin: 0; }
  :root { --bg: #fff; --sheet: #fff; --fg: #1b1f24; --muted: #66707b; --line: #d5dae0; --soft: #f0f2f4; --b: #3f7fc8; --stock: #8c96a1; color-scheme: light; }
  body { background: #fff; }
  .wrap { padding: 0; gap: 0; }
  .wrap > * { max-width: none; }
  .page { width: 297mm; height: 210mm; aspect-ratio: auto; box-shadow: none; break-after: page; overflow: hidden; }
}
</style>

<div class="wrap" id="wrap"></div>

<script>
// Dados da prancheta. Para um roteiro novo, troque ROTEIRO, CENAS, FOLHAS e FECHAMENTO.
const ROTEIRO = "Efeito sonoro · conteúdos cremosos · 9:16 (Reels) · ~33 s";

const CENAS = [ // faixa colorida do topo de cada folha
  { t: [0, 2.7], k: "A" }, { t: [2.7, 4], k: "B" }, { t: [4, 9.2], k: "S" }, { t: [9.2, 13.9], k: "B" },
  { t: [13.9, 14.9], k: "C" }, { t: [14.9, 18.8], k: "S" }, { t: [18.8, 19.7], k: "C" }, { t: [19.7, 22], k: "B" },
  { t: [22, 27], k: "C" }, { t: [27, 33.5], k: "B" },
];

const CHIP = { A: "Gravar · A", B: "Gravar · B", S: "Acervo", C: "Edição" };

const FOLHAS = [
  { titulo: "Gancho e <em>série</em>", faixa: [0, 9.2],
    quadros: [
      { d: "A", k: "A", nome: "Ângulo A · médio-fechado", t: "0–2,7 s", nota: "Olhos logo abaixo da linha de cima: o topo é do texto. Câmera na altura dos olhos." },
      { d: "entrada", k: "A", nome: "Entrada em movimento", t: "0–0,3 s", nota: "Comece fora do centro e entre no quadro. O 1º frame nunca é parado." },
      { d: "B", k: "B", nome: "Ângulo B · aberto com mesa", t: "2,7–4 s", nota: "Tripé acima dos olhos, inclinado para baixo. Mesa cortando o terço de baixo." },
      { d: "acervo", k: "S", nome: "Antes e depois", t: "4–9,2 s", nota: "3 trechos editados; depois o cru na moldura e o editado em tela cheia." },
    ],
    falas: [
      { t: "0–2,7 s", k: "A", fala: "É assim que os seus <b>conteúdos</b> deixam de ser <b>chatos</b>…", tela: "texto gigante palavra por palavra no topo, “CONTEÚDOS” em amarelo", som: "voz já no 0 s, pop na entrada do texto" },
      { t: "2,7–4 s", k: "B", fala: "…e passam a ser <b>cremosos</b>.", tela: "“CREMOSOS.” em amarelo, um pouco maior", som: "whoosh no corte de ângulo" },
      { t: "4–7,4 s", k: "S", fala: "Parte 1 da série onde eu te ensino a levar os seus conteúdos…", tela: "3 trechos editados seus; legenda pequena no centro", som: "trilha" },
      { t: "7,4–8,1 s", k: "S", fala: "…<b>disso</b>…", tela: "vídeo cru na moldura branca", som: "silêncio total" },
      { t: "8,1–9,2 s", k: "S", fala: "…pra <b>isso</b>.", tela: "vídeo editado em tela cheia", som: "impacto; trilha volta" },
    ] },
  { titulo: "Mistério e <em>revelação</em>", faixa: [9.2, 19.7],
    quadros: [
      { d: "B", k: "B", nome: "Ângulo B · mistério", t: "9,2–13,9 s", nota: "Mesmo B, tripé marcado. No fim, olhos fechados e dedo levantado." },
      { d: "cartela", k: "C", nome: "Cartela", t: "13,9–14,9 s", nota: "Fundo branco, texto preto, palavra por palavra." },
      { d: "mao", k: "S", nome: "Exemplo · mão na lente", t: "14,9–18,8 s", nota: "Vídeo antigo. Se ele não tiver, grave a mão cobrindo a lente." },
      { d: "digitando", k: "C", nome: "Texto digitado", t: "18,8–19,7 s", nota: "Um texto de abertura seu, letra a letra." },
    ],
    falas: [
      { t: "9,2–12 s", k: "B", fala: "Esse é o detalhe mais <b>ignorado</b> em conteúdo estratégico…", tela: "legenda pequena no centro", som: "trilha" },
      { t: "12–13,9 s", k: "B", fala: "…porque ninguém percebe que ele está ali. Só quando <b>falta</b>.", tela: "plano mais longo, sem corte", som: "a trilha some 0,3 s antes da revelação" },
      { t: "13,9–14,9 s", k: "C", fala: "<b>Efeito sonoro.</b>", tela: "cartela “Efeito sonoro”", som: "impacto grave; trilha volta" },
      { t: "14,9–19,7 s", k: "S", fala: "Bem colocado, ele faz cada corte ser <b>sentido</b>, e o seu cliente assiste <b>até o fim</b>.", tela: "exemplo com mão na lente e texto animado; depois o texto sendo digitado", som: "whoosh na mão, pops no texto, teclado" },
    ] },
  { titulo: "Lista e <em>CTA</em>", faixa: [19.7, 33.5],
    quadros: [
      { d: "B", k: "B", nome: "Ângulo B · re-gancho", t: "19,7–22 s", nota: "Mesmo enquadramento do B." },
      { d: "slide", k: "C", nome: "Slides da lista", t: "22–27 s", nota: "4 slides de ~1,2 s: título no topo e um exemplo seu." },
      { d: "cta", k: "B", nome: "Ângulo B · CTA", t: "27–33,5 s", nota: "Plano parado, sem cortes. “SOM” bem visível." },
    ],
    falas: [
      { t: "19,7–22 s", k: "B", fala: "E é exatamente aqui que eu coloco os meus:", tela: "legenda pequena no centro", som: "trilha" },
      { t: "22–23,2 s", k: "C", fala: "no texto de abertura,", tela: "slide “Texto de abertura” + o começo deste vídeo", som: "pop" },
      { t: "23,2–24,4 s", k: "C", fala: "nos <b>overlays</b>,", tela: "slide “Overlays” + trecho com algo sobreposto", som: "swipe/pop" },
      { t: "24,4–25,6 s", k: "C", fala: "nas transições, quando precisa,", tela: "slide “Transições” + um trecho de b-roll", som: "whoosh" },
      { t: "25,6–27 s", k: "C", fala: "e nos exemplos visuais.", tela: "slide “Exemplos visuais” + trecho com imagem/print", som: "click/ding" },
      { t: "27–33,5 s", k: "B", fala: "Se você quer a lista dos sites onde eu pego todos os meus efeitos de graça, comenta <b>SOM</b>. E se quer a parte 2 da série, me segue.", tela: "“SOM” entre aspas", som: "nenhum efeito: o CTA respira" },
    ] },
];

const FECHAMENTO = {
  passos: [
    ["Monte o Ângulo B", "Tripé um pouco acima dos olhos, mesa em primeiro plano. Marque os pés do tripé com fita."],
    ["Grave as falas do B", "Folhas 1 a 3, tudo que tem “Gravar · B”. Pode gravar o texto inteiro de uma vez, 2 ou 3 takes."],
    ["Mude para o Ângulo A", "Câmera na altura dos olhos, mais perto. Espaço acima da cabeça para o texto gigante."],
    ["Grave o gancho no A", "Com a entrada em movimento. De 3 a 5 takes: é o trecho mais importante. Fale a frase inteira, até “cremosos”."],
    ["Extras", "Mão na lente, se o vídeo de exemplo não tiver."],
    ["Separe o acervo", "3 trechos editados · 1 vídeo cru + 1 editado · 1 com texto animado · 1 com overlay · 1 com exemplo visual."],
  ],
  intencao: [
    "Texto gigante só no gancho, com <b>CONTEÚDOS</b> e <b>CREMOSOS</b> em destaque; depois, legenda discreta. <span class='why'>O texto grande segura os 3 primeiros segundos.</span>",
    "Cortes caindo exatamente na palavra: troca de ângulo no gancho, “disso / pra isso” e cada item da lista.",
    "O “antes” em silêncio total. <span class='why'>O contraste é a prova do que o vídeo ensina.</span>",
    "Um respiro de silêncio antes de “Efeito sonoro”, e depois o impacto.",
    "Cada item da lista toca o efeito que ele ensina.",
    "Algo novo na tela a cada ~1,5 s até o CTA.",
    "CTA limpo: plano parado, sem efeitos, “SOM” bem visível.",
  ],
  livre: [
    "Fontes, cores e animação das legendas, desde que o destaque continue claro.",
    "Quais efeitos sonoros usar e onde mais colocar.",
    "A trilha: energia média, sempre abaixo da voz.",
    "Transições, zooms, b-roll extra e a ordem dos trechos do acervo.",
    "O visual das molduras e dos slides; o branco é só sugestão.",
    "Cortar ou estender um bloco se o ritmo pedir.",
  ],
};

/* ---------- desenho dos quadros (9:16, grade 3×3) ---------- */
const NS = "http://www.w3.org/2000/svg", W = 90, H = 160;
let uid = 0;
const el = (tag, a = {}, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };

// silhueta anônima: cabeça lisa, pescoço e ombros, sem rosto
function silhueta(g, cx, hy, s) {
  const P = (dx, dy) => `${cx + dx * s} ${hy + dy * s}`;
  el("path", { fill: "var(--vf-body)", d:
    `M${P(-3.4, 5)} L${P(-3.6, 10.5)} C${P(-6, 12.5)} ${P(-14, 13.5)} ${P(-17, 15.5)} C${P(-19.5, 17)} ${P(-20.5, 20)} ${P(-20.5, 24)}` +
    ` L${cx - 21 * s} ${H + 40} L${cx + 21 * s} ${H + 40}` +
    ` L${P(20.5, 24)} C${P(20.5, 20)} ${P(19.5, 17)} ${P(17, 15.5)} C${P(14, 13.5)} ${P(6, 12.5)} ${P(3.6, 10.5)} L${P(3.4, 5)} Z` }, g);
  el("ellipse", { cx, cy: hy, rx: 6.4 * s, ry: 7.9 * s, fill: "var(--vf-head)" }, g);
}

function sala(svg) {
  const id = "w" + (++uid), defs = el("defs", {}, svg);
  const lg = el("linearGradient", { id, x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  el("stop", { offset: 0, "stop-color": "var(--vf-wall-1)" }, lg); el("stop", { offset: 1, "stop-color": "var(--vf-wall-2)" }, lg);
  const rg = el("radialGradient", { id: id + "l", cx: .85, cy: .3, r: .45 }, defs);
  el("stop", { offset: 0, "stop-color": "rgba(255,200,130,.22)" }, rg); el("stop", { offset: 1, "stop-color": "rgba(255,200,130,0)" }, rg);
  el("rect", { width: W, height: H, fill: `url(#${id})` }, svg);
  el("rect", { width: W, height: H, fill: `url(#${id}l)` }, svg);
  el("rect", { x: 7, y: 36, width: 15, height: 19, fill: "none", stroke: "rgba(255,255,255,.1)", "stroke-width": .8 }, svg);
}
function grade(svg) {
  const g = el("g", { stroke: "var(--vf-grid)", "stroke-width": .45, "stroke-dasharray": "2 1.6" }, svg);
  for (const f of [1 / 3, 2 / 3]) { el("line", { x1: W * f, y1: 0, x2: W * f, y2: H }, g); el("line", { x1: 0, y1: H * f, x2: W, y2: H * f }, g); }
}
function interfaceIG(svg) {
  const id = "h" + (++uid), defs = el("defs", {}, svg);
  const p = el("pattern", { id, width: 3, height: 3, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" }, defs);
  el("rect", { width: 1.1, height: 3, fill: "rgba(255,110,110,.45)" }, p);
  el("rect", { x: 0, y: H * .83, width: W, height: H * .17, fill: `url(#${id})` }, svg);
  el("rect", { x: W * .87, y: H * .53, width: W * .13, height: H * .30, fill: `url(#${id})` }, svg);
}
function olhos(svg, y) {
  for (const [a, b] of [[0, 7], [W - 7, W]]) el("line", { x1: a, y1: y, x2: b, y2: y, stroke: "var(--accent)", "stroke-width": 1.3 }, svg);
}
function texto(svg, x, y, w, h, label, size, cor = "#fff") {
  el("rect", { x, y, width: w, height: h, rx: 1, fill: "rgba(245,208,0,.14)", stroke: "var(--accent)", "stroke-width": .5 }, svg);
  el("text", { x: x + w / 2, y: y + h / 2 + size * .36, "text-anchor": "middle", fill: cor, "font-family": "Barlow Condensed, Arial Narrow, sans-serif", "font-weight": 700, "font-size": size }, svg).textContent = label;
}
function mesa(svg) { el("polygon", { points: `0,104 ${W},119 ${W},${H} 0,${H}`, fill: "var(--vf-desk)" }, svg); }
function branco(svg) { el("rect", { width: W, height: H, fill: "var(--vf-white)" }, svg); }
function janela(svg, x, y, w, h, s, hy) {
  const id = "c" + (++uid), cp = el("clipPath", { id }, el("defs", {}, svg));
  el("rect", { x, y, width: w, height: h }, cp);
  const g = el("g", { "clip-path": `url(#${id})` }, svg);
  el("rect", { x, y, width: w, height: h, fill: "var(--vf-wall-2)" }, g);
  silhueta(g, x + w / 2, hy, s);
}
function rotulo(svg, x, y, txt, size = 4.6, cor = "#8a929b") {
  el("text", { x, y, "text-anchor": "middle", fill: cor, "font-family": "JetBrains Mono, monospace", "font-size": size }, svg).textContent = txt;
}

const DESENHOS = {
  A(s) { sala(s); silhueta(s, 45, 63, 1.7); texto(s, 9, 15, 72, 21, "TEXTO GIGANTE", 10); grade(s); interfaceIG(s); olhos(s, 63); },
  entrada(s) {
    sala(s);
    const ghost = el("g", { opacity: .35, transform: "translate(22 4) rotate(-7 45 110)" }, s); silhueta(ghost, 45, 63, 1.7);
    silhueta(s, 45, 63, 1.7);
    const a = el("g", { stroke: "var(--accent)", "stroke-width": 1.6, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" }, s);

/* ---------- montagem das folhas ---------- */
const wrap = document.getElementById("wrap");
const nFolhas = FOLHAS.length + 1;
const seg = n => String(n).replace(".", ",");

function cabecalho(i, titulo, faixa) {
  const h = document.createElement("header"); h.className = "head";
  h.innerHTML = `<div class="slate">Prancheta · ${ROTEIRO}</div><h2>${titulo}</h2><div class="pg"><small>folha</small>${i}<small>de ${nFolhas}</small></div>`;
  const mini = document.createElement("div"); mini.className = "mini";
  for (const c of CENAS) {
    const sp = document.createElement("span"); sp.className = "k-" + c.k; sp.style.flex = String(c.t[1] - c.t[0]);
    if (!faixa || (c.t[0] >= faixa[0] && c.t[1] <= faixa[1])) sp.classList.add("on");
    mini.appendChild(sp);
  }
  h.appendChild(mini);
  const sub = document.createElement("div"); sub.className = "slate"; sub.style.gridColumn = "1 / -1";
  sub.textContent = faixa ? `${seg(faixa[0])}–${seg(faixa[1])} s` : "antes de gravar e editar";
  h.appendChild(sub);
  return h;
}
function rodape() {
  const f = document.createElement("footer"); f.className = "foot";
  f.innerHTML = `<span><i class="sw grid"></i>grade 3×3 da câmera</span><span><i class="sw eye"></i>linha dos olhos</span><span><i class="sw txt"></i>onde entra o texto</span><span><i class="sw ui"></i>interface do Instagram (aprox.)</span>`;
  return f;
}

FOLHAS.forEach((F, i) => {
  const page = document.createElement("section"); page.className = "page";
  page.appendChild(cabecalho(i + 1, F.titulo, F.faixa));
  const body = document.createElement("div"); body.className = "body";
  const frames = document.createElement("div"); frames.className = "frames"; frames.style.setProperty("--n", F.quadros.length);
  for (const q of F.quadros) {
    const fr = document.createElement("figure"); fr.className = "fr";
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": q.nome });
    DESENHOS[q.d](svg); fr.appendChild(svg);
    fr.insertAdjacentHTML("beforeend", `<div><span class="chip ${q.k}">${CHIP[q.k]}</span></div><h3>${q.nome}</h3><div class="t">${q.t}</div><p>${q.nota}</p>`);
    frames.appendChild(fr);
  }
  const lines = document.createElement("div"); lines.className = "lines";
  lines.innerHTML = "<h4>Falas desta faixa</h4>";
  for (const l of F.falas) {
    lines.insertAdjacentHTML("beforeend", `<div class="ln"><div class="tc">${l.t}<span class="chip ${l.k}">${CHIP[l.k]}</span></div><div class="say">${l.fala}</div><div class="meta"><i>tela</i>${l.tela} · <i>som</i>${l.som}</div></div>`);
  }
  body.append(frames, lines);
  page.append(body, rodape());
  wrap.appendChild(page);
});

const fim = document.createElement("section"); fim.className = "page";
fim.appendChild(cabecalho(nFolhas, "Gravação e <em>edição</em>", null));
const cl = document.createElement("div"); cl.className = "closing";
cl.innerHTML = `<div><h3>Ordem de gravação</h3><ol class="steps">${FECHAMENTO.passos.map(([t, d]) => `<li><b>${t}</b><span>${d}</span></li>`).join("")}</ol></div>
<div><h3>Para o editor</h3><p class="ed-note">Isto é um norte, não uma receita. Os tempos são referência. Confio na sua criatividade: se tiver uma ideia melhor, faça e me mostre. Só não deixe a intenção se perder.</p>
<div class="cols"><div><h4>A intenção (não pode faltar)</h4><ul>${FECHAMENTO.intencao.map(x => `<li>${x}</li>`).join("")}</ul></div>
<div class="free"><h4>Fica a seu critério</h4><ul>${FECHAMENTO.livre.map(x => `<li>${x}</li>`).join("")}</ul></div></div></div>`;
fim.append(cl, rodape());
wrap.appendChild(fim);
</script>
